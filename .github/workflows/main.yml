name: Build Medha AI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Generate app icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android --assetPath assets

      - name: Copy web files into the app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Medha-AI.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medha-AI-APK
          path: Medha-AI.apk
          retention-days: 90

      - name: Publish a downloadable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Medha AI build ${{ github.run_number }}
          body: Download Medha-AI.apk below and install on any Android phone.
          files: Medha-AI.apk
